name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: python -m mypy --config-file backend/pyproject.toml backend/app backend/tests
      - run: python -m pytest -q backend/tests
        env:
          PYTHONPATH: backend
      - run: python scripts/check_m0_reports.py
