uot;c&quot;:&quot;$../ParallelSerialOption == \&quot;Yes\&quot; and not S_CheckForSkin()&quot;,&quot;s&quot;:&quot;常规&quot;,&quot;c2&quot;:[]},{&quot;n&quot;:&quot;Maximum Number of Island Faces&quot;,&quot;k&quot;:&quot;INTEGER&quot;,&quot;t&quot;:&quot;int&quot;,&quot;d&quot;:&quot;500&quot;,&quot;a&quot;:null,&quot;c&quot;:&quot;$../AdvancedOptions and not S_CheckForSkin()&quot;,&quot;s&quot;:&quot;高级选项&quot;,&quot;c2&quot;:[]},{&quot;n&quot;:&quot;Min Spike Angle&quot;,&quot;k&quot;:&quot;REAL&quot;,&quot;t&quot;:&quot;float&quot;,&quot;d&quot;:&quot;S_SurfaceMeshSpikeRemovalAngle()&quot;,&quot;a&quot;:null,&quot;c&quot;:&quot;$../AdvancedOptions and not S_PrimeWrapperFeature() and not S_CheckForSkin()&quot;,&quot;s&quot;:&quot;高级选项&quot;,&quot;c2&quot;:[]},{&quot;n&quot;:&quot;Min Dihedral Angle&quot;,&quot;k&quot;:&quot;REAL&quot;,&quot;t&quot;:&quot;float&quot;,&quot;d&quot;:&quot;S_SurfaceMeshDihedralMinAngle()&quot;,&quot;a&quot;:null,&quot;c&quot;:&quot;$../AdvancedOptions and not S_PrimeWrapperFeature() and not S_CheckForSkin()&quot;,&quot;s&quot;:&quot;高级选项&quot;,&quot;c2&quot;:[]},{&quot;n&quot;:&quot;Project on Geometry of the CFD Surface Mesh Objects?&quot;,&quot;k&quot;:&quot;STRING&quot;,&quot;t&quot;:&quot;string&quot;,&quot;d&quot;:&quot;\&quot;No\&quot;&quot;,&quot;a&quot;:&quot;[\&quot;No\&quot;, \&quot;Yes\&quot;]&quot;,&quot;c&quot;:&quot;$../AdvancedOptions and S_EnabledPrimeSurfaceMesh() and not S_CheckForSkin()&quot;,&quot;s&quot;:&quot;高级选项&quot;,&quot;c2&quot;:[]},{&quot;n&quot;:&quot;Auto Assign Zone Types?&quot;,&quot;k&quot;:&quot;STRING&quot;,&quot;t&quot;:&quot;string&quot;,&quot;d&quot;:&quot;\&quot;No\&quot;&quot;,&quot;a&quot;:&quot;[\&quot;No\&quot;, \&quot;Yes\&quot;]&quot;,&quot;c&quot;:&quot;$../AdvancedOptions and not S_CheckForSkin()&quot;,&quot;s&quot;:&quot;高级选项&quot;,&quot;c2&quot;:[]},{&quot;n&quot;:&quot;Merge Interior Pockets?&quot;,&quot;k&quot;:&quot;STRING&quot;,&quot;t&quot;:&quot;string&quot;,&quot;d&quot;:&quot;\&quot;No\&quot;&quot;,&quot;a&quot;:&quot;[\&quot;No\&quot;, \&quot;Yes\&quot;]&quot;,&quot;c&quot;:&quot;$../AdvancedOptions&quot;,&quot;s&quot;:&quot;高级选项&quot;,&quot;c2&quot;:[]},{&quot;n&quot;:&quot;Gap-Cover Zone Recovery&quot;,&quot;k&quot;:&quot;STRING&quot;,&quot;t&quot;:&quot;string&quot;,&quot;d&quot;:&quot;\&quot;No\&quot;&quot;,&quot;a&quot;:&quot;[\&quot;No\&quot;, \&quot;Yes\&quot;]&quot;,&quot;c&quot;:&quot;$../AdvancedOptions&quot;,&quot;s&quot;:&quot;高级选项&quot;,&quot;c2&quot;:[]},{&quot;n&quot;:&quot;Global Minimum&quot;,&quot;k&quot;:&quot;REAL&quot;,&quot;t&quot;:&quot;float&quot;,&quot;d&quot;:&quot;S_SurfaceMeshGlobalMin()&quot;,&quot;a&quot;:null,&quot;c&quot;:&quot;$../AdvancedOptions&quot;,&quot;s&quot;:&quot;高级选项&quot;,&quot;c2&quot;:[]},{&quot;n&quot;:&quot;Do you want to show meshing sub tasks?&quot;,&quot;k&quot;:&quot;STRING&quot;,&quot;t&quot;:&quot;string&quot;,&quot;d&quot;:&quot;\&quot;No\&quot;&quot;,&quot;a&quot;:&quot;[\&quot;No\&quot;, \&quot;Yes\&quot;]&quot;,&quot;c&quot;:null,&quot;s&quot;:&quot;开发者/内部&quot;,&quot;c2&quot;:[]}]}]}]&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;meshing-flow-map&quot;);
      if (!root || root.dataset.ready === &quot;true&quot;) return;
      root.dataset.ready = &quot;true&quot;;
      const workflows = JSON.parse(document.getElementById(&quot;mfm-data&quot;).textContent);
      const flow = document.getElementById(&quot;mfm-flow&quot;);
      const summary = document.getElementById(&quot;mfm-summary&quot;);
      const toggleAll = document.getElementById(&quot;mfm-toggle-all&quot;);
      const workflowButtons = [...root.querySelectorAll(&quot;[data-workflow]&quot;)];
      const expandedByWorkflow = {
        watertight: new Set([1, 2, 3]),
        &quot;fault-tolerant&quot;: new Set([1, 2, 3]),
      };
      let activeWorkflow = &quot;watertight&quot;;

      const element = (tag, className, text) =&gt; {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined &amp;&amp; text !== null) node.textContent = String(text);
        return node;
      };

      const leafCount = (nodes) =&gt; nodes.reduce(
        (total, node) =&gt; total + (node.c2 &amp;&amp; node.c2.length ? leafCount(node.c2) : 1),
        0,
      );

      const addCondition = (parent, condition) =&gt; {
        if (!condition) return;
        const details = element(&quot;details&quot;);
        details.appendChild(element(&quot;summary&quot;, &quot;text-small&quot;, &quot;显示条件&quot;));
        details.appendChild(element(&quot;code&quot;, &quot;text-small&quot;, condition));
        parent.appendChild(details);
      };

      const renderNode = (data) =&gt; {
        const sectionClass = data.s === &quot;高级选项&quot;
          ? &quot;is-advanced&quot;
          : data.s === &quot;开发者/内部&quot;
            ? &quot;is-developer&quot;
            : &quot;&quot;;
        const groupClass = data.c2 &amp;&amp; data.c2.length ? &quot;is-group&quot; : &quot;&quot;;
        const conditionClass = data.c ? &quot;has-condition&quot; : &quot;&quot;;
        const wrapper = element(&quot;div&quot;, `mfm-node ${sectionClass} ${groupClass} ${conditionClass}`.trim());
        wrapper.appendChild(element(&quot;span&quot;, &quot;mfm-node-marker&quot;));
        const card = element(&quot;div&quot;, &quot;mfm-node-card&quot;);
        const title = element(&quot;div&quot;, &quot;mfm-node-title&quot;);
        const label = element(&quot;span&quot;, &quot;&quot;, data.n || data.k || &quot;未命名&quot;);
        title.appendChild(label);
        if (data.k === &quot;object&quot;) title.appendChild(element(&quot;span&quot;, &quot;mfm-chip&quot;, &quot;分组&quot;));
        else if (data.t) title.appendChild(element(&quot;span&quot;, &quot;mfm-chip&quot;, data.t));
        if (data.c) title.appendChild(element(&quot;span&quot;, &quot;mfm-chip is-condition&quot;, &quot;条件&quot;));
        card.appendChild(title);
        const meta = element(&quot;div&quot;, &quot;mfm-value-grid text-small&quot;);
        if (data.d) meta.appendChild(element(&quot;span&quot;, &quot;&quot;, `默认：${data.d}`));
        if (data.a) meta.appendChild(element(&quot;span&quot;, &quot;&quot;, `可选/来源：${data.a}`));
        if (meta.childElementCount) card.appendChild(meta);
        addCondition(card, data.c);
        wrapper.appendChild(card);
        if (data.c2 &amp;&amp; data.c2.length) {
          const children = element(&quot;div&quot;, &quot;mfm-children&quot;);
          data.c2.forEach((child) =&gt; children.appendChild(renderNode(child)));
          wrapper.appendChild(children);
        }
        return wrapper;
      };

      const isConditionalTask = (task) =&gt;
        task.t === &quot;Conditional&quot; || /Share Topology|Capping|Create Regions/.test(task.n);

      const taskOptions = (task) =&gt; {
        const box = element(&quot;div&quot;, &quot;mfm-option-flow&quot;);
        if (!task.o.length) {
          box.appendChild(element(&quot;div&quot;, &quot;mfm-empty text-small&quot;, &quot;该任务无公开填写项&quot;));
          return box;
        }
        task.o.forEach((option) =&gt; box.appendChild(renderNode(option)));
        return box;
      };

      const renderTask = (task, totalTasks) =&gt; {
        const article = element(
          &quot;article&quot;,
          `mfm-task ${isConditionalTask(task) ? &quot;is-conditional&quot; : &quot;&quot;}`.trim(),
        );
        const expanded = expandedByWorkflow[activeWorkflow].has(task.i);
        const head = element(&quot;button&quot;, &quot;mfm-task-head&quot;);
        head.type = &quot;button&quot;;
        head.setAttribute(&quot;aria-expanded&quot;, String(expanded));
        head.appendChild(element(&quot;span&quot;, &quot;mfm-seq&quot;, String(task.i).padStart(2, &quot;0&quot;)));
        const title = element(&quot;span&quot;, &quot;mfm-task-title&quot;);
        title.appendChild(element(&quot;strong&quot;, &quot;&quot;, task.n));
        title.appendChild(
          element(
            &quot;span&quot;,
            &quot;text-small text-muted&quot;,
            `${task.t || &quot;Task&quot;} · ${leafCount(task.o)} 个填写项 · ${task.q || &quot;&quot;}`,
          ),
        );
        head.appendChild(title);
        head.appendChild(element(&quot;span&quot;, &quot;mfm-chevron&quot;, expanded ? &quot;−&quot; : &quot;+&quot;));
        article.appendChild(head);

        const detail = element(&quot;div&quot;, &quot;mfm-task-detail&quot;);
        detail.hidden = !expanded;
        const meta = element(&quot;div&quot;, &quot;mfm-badges&quot;);
        meta.appendChild(element(&quot;span&quot;, &quot;mfm-chip&quot;, `步骤 ${task.i}/${totalTasks}`));
        if (isConditionalTask(task)) {
          meta.appendChild(element(&quot;span&quot;, &quot;mfm-chip is-condition&quot;, &quot;按条件插入&quot;));
        }
        detail.appendChild(meta);
        if (task.c) {
          const condition = element(&quot;div&quot;, &quot;mfm-task-condition text-small&quot;);
          condition.appendChild(element(&quot;span&quot;, &quot;&quot;, &quot;任务显示条件：&quot;));
          condition.appendChild(element(&quot;code&quot;, &quot;&quot;, task.c));
          detail.appendChild(condition);
        }
        detail.appendChild(taskOptions(task));
        article.appendChild(detail);

        head.addEventListener(&quot;click&quot;, () =&gt; {
          const set = expandedByWorkflow[activeWorkflow];
          if (set.has(task.i)) set.delete(task.i);
          else set.add(task.i);
          render();
        });
        return article;
      };

      const renderConnector = () =&gt; {
        const connector = element(&quot;div&quot;, &quot;mfm-connector&quot;);
        connector.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
        connector.appendChild(element(&quot;span&quot;, &quot;text-small&quot;, &quot;↓&quot;));
        return connector;
      };

      const syncControls = (workflow) =&gt; {
        workflowButtons.forEach((button) =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.workflow === activeWorkflow));
        });
        const total = workflow.tasks.length;
        const expanded = expandedByWorkflow[activeWorkflow].size;
        const allExpanded = expanded === total;
        toggleAll.textContent = allExpanded ? &quot;全部收起&quot; : &quot;全部展开&quot;;
        toggleAll.setAttribute(&quot;aria-pressed&quot;, String(allExpanded));
      };

      const render = () =&gt; {
        const workflow = workflows.find((item) =&gt; item.w === activeWorkflow) || workflows[0];
        flow.replaceChildren();
        summary.textContent = `${workflow.tasks.length} 个任务顺序节点；每个任务节点内按 Fluent 原版 members/arguments 顺序展开填写项。`;
        workflow.tasks.forEach((task, index) =&gt; {
          flow.appendChild(renderTask(task, workflow.tasks.length));
          if (index &lt; workflow.tasks.length - 1) flow.appendChild(renderConnector());
        });
        syncControls(workflow);
      };

      workflowButtons.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          activeWorkflow = button.dataset.workflow;
          render();
        });
      });

      toggleAll.addEventListener(&quot;click&quot;, () =&gt; {
        const workflow = workflows.find((item) =&gt; item.w === activeWorkflow) || workflows[0];
        const set = expandedByWorkflow[activeWorkflow];
        if (set.size === workflow.tasks.length) set.clear();
        else workflow.tasks.forEach((task) =&gt; set.add(task.i));
        render();
      });

      render();
    })();
  &lt;/script&gt;

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
