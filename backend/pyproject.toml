[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# User-facing messages are Chinese-first and intentionally use full-width
# punctuation; those characters are not confusables in this codebase.
allowed-confusables = [
  "，", "。", "；", "：", "（", "）", "、", "！", "？", "“", "”", "‘", "’",
  "【", "】", "《", "》", "～", "…", "—",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = []